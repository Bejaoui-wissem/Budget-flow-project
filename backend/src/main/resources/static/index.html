<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BudgetFlow</title>
<style>
  :root { --blue:#0f2e5c; --green:#16a34a; --red:#dc2626; --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; background:var(--bg); color:#0f172a; }
  header { background:var(--blue); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:960px; margin:20px auto; padding:0 14px; }
  .card { background:var(--card); border-radius:10px; padding:18px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h2 { margin:0 0 12px; font-size:17px; color:var(--blue); }
  label { display:block; font-size:13px; margin:8px 0 3px; color:#475569; }
  input, select { width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  button { background:var(--blue); color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.green { background:var(--green); } button.red { background:var(--red); } button.grey { background:#64748b; }
  button.small { padding:4px 9px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:#475569; font-weight:600; }
  .msg { padding:9px 12px; border-radius:6px; margin-bottom:12px; font-size:14px; display:none; }
  .msg.err { background:#fee2e2; color:#991b1b; display:block; } .msg.ok { background:#dcfce7; color:#166534; display:block; }
  .tabs button { background:#e2e8f0; color:#0f172a; margin-right:6px; } .tabs button.active { background:var(--blue); color:#fff; }
  .hidden { display:none; } .right { text-align:right; } .actions { margin-top:12px; display:flex; gap:8px; }
  #total { margin-top:10px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>BudgetFlow</h1>
  <div id="userbox" class="hidden"><span id="username"></span> <button class="grey small" id="logout">Déconnexion</button></div>
</header>
<main>
  <div id="msg" class="msg"></div>

  <!-- AUTHENTIFICATION -->
  <section id="auth" class="card" style="max-width:420px;margin:30px auto">
    <div class="tabs"><button id="tabLogin" class="active">Connexion</button><button id="tabRegister">Inscription</button></div>
    <div id="loginForm">
      <label>E-mail</label><input id="lEmail" type="email" autocomplete="username">
      <label>Mot de passe</label><input id="lPass" type="password" autocomplete="current-password">
      <div class="actions"><button id="btnLogin">Se connecter</button></div>
    </div>
    <div id="registerForm" class="hidden">
      <div class="row"><div><label>Nom</label><input id="rNom"></div><div><label>Prénom</label><input id="rPrenom"></div></div>
      <label>E-mail</label><input id="rEmail" type="email">
      <label>Mot de passe (8 caractères min.)</label><input id="rPass" type="password" autocomplete="new-password">
      <label>Confirmation</label><input id="rPass2" type="password" autocomplete="new-password">
      <div class="actions"><button class="green" id="btnRegister">Créer mon compte</button></div>
    </div>
  </section>

  <!-- APPLICATION -->
  <div id="app" class="hidden">
    <section class="card">
      <h2 id="formTitle">Ajouter une dépense</h2>
      <div class="row">
        <div><label>Montant (DT)</label><input id="eMontant" type="number" step="0.01" min="0"></div>
        <div><label>Date</label><input id="eDate" type="date"></div>
        <div><label>Catégorie</label><select id="eCat"></select></div>
        <div><label>Mode de paiement</label><select id="ePay"><option>Espèces</option><option>Carte</option><option>Virement</option><option>Autre</option></select></div>
      </div>
      <label>Description</label><input id="eDesc" maxlength="255">
      <div class="actions"><button class="green" id="btnSave">Enregistrer</button><button class="grey hidden" id="btnCancel">Annuler la modification</button></div>
    </section>

    <section class="card">
      <h2>Mes dépenses</h2>
      <div class="row">
        <div><label>Recherche</label><input id="fQ" placeholder="description…"></div>
        <div><label>Catégorie</label><select id="fCat"></select></div>
        <div><label>Du</label><input id="fFrom" type="date"></div>
        <div><label>Au</label><input id="fTo" type="date"></div>
        <div><label>Tri</label><select id="fSort"><option value="date:desc">Date (récent)</option><option value="date:asc">Date (ancien)</option><option value="montant:desc">Montant (décroissant)</option><option value="montant:asc">Montant (croissant)</option></select></div>
      </div>
      <div class="actions"><button id="btnFilter">Filtrer</button><button class="grey" id="btnReset">Réinitialiser</button></div>
      <table style="margin-top:14px"><thead><tr><th>Date</th><th>Catégorie</th><th>Description</th><th>Paiement</th><th class="right">Montant</th><th></th></tr></thead><tbody id="rows"></tbody></table>
      <div id="empty" class="hidden" style="padding:12px;color:#64748b">Aucune dépense.</div>
      <div id="total"></div>
    </section>

    <section class="card">
      <h2>Mes catégories</h2>
      <div class="row">
        <div><label>Nom</label><input id="cNom" maxlength="50"></div>
        <div><label>Description</label><input id="cDesc" maxlength="255"></div>
      </div>
      <div class="actions"><button class="green" id="btnAddCat">Ajouter une catégorie</button></div>
      <table style="margin-top:14px"><tbody id="catRows"></tbody></table>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('bf_token');
let categories = [];
let editingId = null;

function show(text, ok) {
  const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => { m.className = 'msg'; }, 3000);
}
async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { logout(); }
  if (!res.ok) throw new Error(data.error || 'Erreur ' + res.status);
  return data;
}
function setSession(auth) {
  token = auth.token; localStorage.setItem('bf_token', token);
  $('username').textContent = auth.user.prenom + ' ' + auth.user.nom;
  enterApp();
}
function logout() {
  token = null; localStorage.removeItem('bf_token');
  $('app').classList.add('hidden'); $('userbox').classList.add('hidden'); $('auth').classList.remove('hidden');
}
async function enterApp() {
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden'); $('userbox').classList.remove('hidden');
  $('eDate').value = new Date().toISOString().slice(0, 10);
  await loadCategories(); await loadExpenses();
}

// ---- Authentification
$('tabLogin').onclick = () => { $('loginForm').classList.remove('hidden'); $('registerForm').classList.add('hidden'); $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active'); };
$('tabRegister').onclick = () => { $('registerForm').classList.remove('hidden'); $('loginForm').classList.add('hidden'); $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active'); };
$('btnLogin').onclick = async () => {
  try { setSession(await api('POST', '/auth/login', { email: $('lEmail').value, motDePasse: $('lPass').value })); }
  catch (e) { show(e.message); }
};
$('btnRegister').onclick = async () => {
  try {
    setSession(await api('POST', '/auth/register', { nom: $('rNom').value, prenom: $('rPrenom').value, email: $('rEmail').value, motDePasse: $('rPass').value, confirmationMotDePasse: $('rPass2').value }));
    show('Compte créé', true);
  } catch (e) { show(e.message); }
};
$('logout').onclick = logout;

// ---- Catégories
async function loadCategories() {
  categories = await api('GET', '/categories');
  for (const sel of [$('eCat'), $('fCat')]) {
    const keep = sel.value; sel.replaceChildren();
    if (sel === $('fCat')) sel.append(new Option('Toutes', ''));
    categories.forEach(c => sel.append(new Option(c.nom, c.id)));
    sel.value = keep;
  }
  const body = $('catRows'); body.replaceChildren();
  categories.forEach(c => {
    const tr = document.createElement('tr');
    const n = document.createElement('td'); n.textContent = c.nom + (c.personnalisee ? '' : ' (par défaut)');
    const d = document.createElement('td'); d.textContent = c.description || '';
    const a = document.createElement('td'); a.className = 'right';
    if (c.personnalisee) {
      const b = document.createElement('button'); b.className = 'red small'; b.textContent = 'Supprimer';
      b.onclick = async () => { try { await api('DELETE', '/categories/' + c.id); await loadCategories(); show('Catégorie supprimée', true); } catch (e) { show(e.message); } };
      a.append(b);
    }
    tr.append(n, d, a); body.append(tr);
  });
}
$('btnAddCat').onclick = async () => {
  try { await api('POST', '/categories', { nom: $('cNom').value, description: $('cDesc').value }); $('cNom').value = ''; $('cDesc').value = ''; await loadCategories(); show('Catégorie ajoutée', true); }
  catch (e) { show(e.message); }
};

// ---- Dépenses
function query() {
  const p = new URLSearchParams(); const [sort, order] = $('fSort').value.split(':');
  if ($('fQ').value) p.set('q', $('fQ').value);
  if ($('fCat').value) p.set('categoryId', $('fCat').value);
  if ($('fFrom').value) p.set('from', $('fFrom').value);
  if ($('fTo').value) p.set('to', $('fTo').value);
  p.set('sort', sort); p.set('order', order);
  return p.toString();
}
async function loadExpenses() {
  try {
    const list = await api('GET', '/expenses?' + query());
    const body = $('rows'); body.replaceChildren(); let total = 0;
    list.forEach(e => {
      total += Number(e.montant);
      const tr = document.createElement('tr');
      [e.date, e.categoryName, e.description || '', e.modePaiement || ''].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.append(td); });
      const m = document.createElement('td'); m.className = 'right'; m.textContent = Number(e.montant).toFixed(2) + ' DT'; tr.append(m);
      const a = document.createElement('td'); a.className = 'right';
      const be = document.createElement('button'); be.className = 'small'; be.textContent = 'Modifier'; be.onclick = () => startEdit(e);
      const bd = document.createElement('button'); bd.className = 'red small'; bd.textContent = 'Supprimer'; bd.style.marginLeft = '4px';
      bd.onclick = async () => { if (!confirm('Supprimer cette dépense ?')) return; try { await api('DELETE', '/expenses/' + e.id); await loadExpenses(); show('Dépense supprimée', true); } catch (x) { show(x.message); } };
      a.append(be, bd); tr.append(a); body.append(tr);
    });
    $('empty').classList.toggle('hidden', list.length > 0);
    $('total').textContent = list.length ? 'Total : ' + total.toFixed(2) + ' DT' : '';
  } catch (e) { show(e.message); }
}
function startEdit(e) {
  editingId = e.id; $('formTitle').textContent = 'Modifier la dépense #' + e.id;
  $('eMontant').value = e.montant; $('eDate').value = e.date; $('eCat').value = e.categoryId;
  $('ePay').value = e.modePaiement || 'Autre'; $('eDesc').value = e.description || '';
  $('btnCancel').classList.remove('hidden'); window.scrollTo(0, 0);
}
function resetForm() {
  editingId = null; $('formTitle').textContent = 'Ajouter une dépense';
  $('eMontant').value = ''; $('eDesc').value = ''; $('btnCancel').classList.add('hidden');
}
$('btnCancel').onclick = resetForm;
$('btnSave').onclick = async () => {
  const body = { montant: $('eMontant').value === '' ? null : Number($('eMontant').value), date: $('eDate').value,
    description: $('eDesc').value, modePaiement: $('ePay').value, categoryId: Number($('eCat').value) };
  try {
    if (editingId) await api('PUT', '/expenses/' + editingId, body); else await api('POST', '/expenses', body);
    show(editingId ? 'Dépense modifiée' : 'Dépense ajoutée', true); resetForm(); await loadExpenses();
  } catch (e) { show(e.message); }
};
$('btnFilter').onclick = loadExpenses;
$('btnReset').onclick = () => { ['fQ', 'fCat', 'fFrom', 'fTo'].forEach(i => $(i).value = ''); $('fSort').value = 'date:desc'; loadExpenses(); };

// ---- Démarrage : reprend la session si le jeton est encore valide
(async () => {
  if (!token) return;
  try { const u = await api('GET', '/auth/me'); $('username').textContent = u.prenom + ' ' + u.nom; enterApp(); }
  catch (e) { logout(); }
})();
</script>
</body>
</html>
