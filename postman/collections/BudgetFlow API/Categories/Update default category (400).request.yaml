$kind: http-request
url: "{{baseUrl}}/api/categories/{{defaultCategoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Hack",
      "description": "x"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 5000
