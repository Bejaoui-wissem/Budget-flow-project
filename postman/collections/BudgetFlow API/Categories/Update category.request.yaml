$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Test Category (edited)",
      "description": "Updated"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
