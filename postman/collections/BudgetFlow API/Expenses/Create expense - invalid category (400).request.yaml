$kind: http-request
url: "{{baseUrl}}/api/expenses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "montant": 15.5,
      "date": "2026-10-02",
      "description": "Taxi",
      "modePaiement": "Espèces",
      "categoryId": 999999
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 8000
