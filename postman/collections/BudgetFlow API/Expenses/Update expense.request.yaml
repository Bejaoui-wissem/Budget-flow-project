$kind: http-request
url: "{{baseUrl}}/api/expenses/{{expenseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "montant": 18,
      "date": "2026-10-02",
      "description": "Taxi aéroport",
      "modePaiement": "Carte",
      "categoryId": {{categoryId}}
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
