$kind: http-request
url: "{{baseUrl}}/api/expenses?categoryId={{categoryId}}&from=2026-01-01&to=2026-12-31&q=Taxi&sort=montant&order=desc"
method: GET
queryParams:
  categoryId: "{{categoryId}}"
  from: 2026-01-01
  to: 2026-12-31
  q: Taxi
  sort: montant
  order: desc
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
