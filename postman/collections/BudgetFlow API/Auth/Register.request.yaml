$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Hedfi",
      "prenom": "Afrah",
      "email": "{{email}}",
      "motDePasse": "{{password}}",
      "confirmationMotDePasse": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created or 409 (already registered)", function () { pm.expect(pm.response.code).to.be.oneOf([201,409]); });
      if (pm.response.code === 201) { var j = pm.response.json(); if (j.token) pm.collectionVariables.set("token", j.token); }
    language: text/javascript
order: 1000
