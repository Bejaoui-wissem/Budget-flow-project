$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "motDePasse": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
